<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MineNex — Магазин</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0b0b0f;
            color: white;
        }

        .header {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #24242c;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        .hero {
            padding: 60px 20px;
            text-align: center;
        }

        .hero h1 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        .hero p {
            color: #a0a0aa;
            font-size: 18px;
        }

        .button {
            display: inline-block;
            margin-top: 30px;
            padding: 15px 25px;
            background: #6c4cff;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <header class="header">
        <div class="logo">MineNex</div>
    </header>

    <main>

        <section class="hero">
            <h1>Магазин MineNex</h1>

            <p>
                Приобретайте привилегии и другие товары
                для нашего сервера.
            </p>

            <a href="#" class="button">
                Перейти в магазин
            </a>
        </section>

    </main>

</body>
</html>
